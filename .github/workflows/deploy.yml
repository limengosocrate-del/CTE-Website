name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angularfire-start/package-lock.json

      - name: Install dependencies
        working-directory: angularfire-start
        run: npm ci

      - name: Build Angular
        working-directory: angularfire-start
        run: npm run build -- --base-href=/CTE-Website/

      - name: Find Angular build output
        run: |
          echo "Contenu de angularfire-start/dist :"
          find angularfire-start/dist -maxdepth 3 -type f | head -100

      - name: Prepare GitHub Pages
        run: |
          BUILD_DIR=$(find angularfire-start/dist -name index.html -type f | head -1 | xargs dirname)

          if [ -z "$BUILD_DIR" ]; then
            echo "ERREUR : index.html introuvable dans le dossier dist"
            exit 1
          fi

          echo "Application trouvée dans : $BUILD_DIR"

          touch "$BUILD_DIR/.nojekyll"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

          echo "Fichiers prêts :"
          ls -la "$BUILD_DIR"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
