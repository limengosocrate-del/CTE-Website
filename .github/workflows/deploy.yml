name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: angularfire-start

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: angularfire-start/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler l'application Angular
        run: npm run build -- --base-href=/inspecteurBot-IA/

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers pour GitHub Pages
        run: |
          touch dist/friendlychat/.nojekyll
          cp dist/friendlychat/index.html dist/friendlychat/404.html

      - name: Télécharger l'application
        uses: actions/upload-pages-artifact@v3
        with:
          path: angularfire-start/dist/friendlychat

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
