name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        working-directory: angularfire-start
        run: npm install

      - name: Compiler Angular
        working-directory: angularfire-start
        run: npm run build -- --base-href=/CTE-Website/

      - name: Vérifier le résultat du build
        run: |
          echo "Recherche du fichier index.html..."
          find angularfire-start/dist -name index.html -type f

      - name: Préparer GitHub Pages
        run: |
          BUILD_DIR=$(find angularfire-start/dist -name index.html -type f | head -1 | xargs dirname)

          if [ -z "$BUILD_DIR" ]; then
            echo "ERREUR : index.html introuvable."
            exit 1
          fi

          echo "Application Angular trouvée dans : $BUILD_DIR"

          touch "$BUILD_DIR/.nojekyll"
          cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"

          echo "Contenu final :"
          ls -la "$BUILD_DIR"

          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Télécharger l'application
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
